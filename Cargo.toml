[package]
name = "ical-rs"
description = "iCalendar (vCalendar 1.0, iCalendar 2.0): a byte-faithful syntax tree and a decoded model"
version = "0.0.1"
authors = ["soywod <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
categories = ["data-structures", "parser-implementations", "encoding"]
keywords = ["icalendar", "calendar", "caldav", "rfc5545", "codec"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/ical-rs/latest/ical-rs"
repository = "https://github.com/pimalaya/ical-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["parser", "quoted-printable", "base64", "encoding"]
parser = ["dep:memchr"]
quoted-printable = ["dep:quoted_printable"]
base64 = ["dep:base64"]
encoding = ["dep:encoding_rs"]

[dependencies]
memchr = { version = "2", default-features = false, optional = true }
quoted_printable = { version = "0.5", default-features = false, optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"], optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
criterion = "0.5"

[lib]
name = "ical"
path = "src/lib.rs"

[[bench]]
name = "parse"
harness = false
