[package]
name = "ical-rs"
description = "iCalendar parser, validator, editor, merger and builder library"
version = "0.4.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["data-structures", "parser-implementations", "encoding", "no-std"]
keywords = ["icalendar", "calendar", "caldav", "rfc5545", "codec"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/ical-rs/latest/ical"
repository = "https://github.com/pimalaya/ical"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "ical"

[features]
default = ["parser", "quoted-printable", "base64", "encoding"]
parser = ["dep:memchr"]
jcal = ["dep:serde_json"]
jscalendar = ["jcal"]
quoted-printable = ["dep:quoted_printable"]
base64 = ["dep:base64"]
encoding = ["dep:encoding_rs"]

[[bench]]
name = "parse"
path = "benches/parse.rs"
harness = false
required-features = ["parser"]

[[example]]
name = "parse_edit_export"
path = "examples/parse_edit_export.rs"
required-features = ["parser"]

[[example]]
name = "structured_values"
path = "examples/structured_values.rs"
required-features = ["parser"]

[[example]]
name = "forgiving_parse"
path = "examples/forgiving_parse.rs"
required-features = ["parser"]

[[example]]
name = "all_versions"
path = "examples/all_versions.rs"
required-features = ["parser"]

[[example]]
name = "recurrence"
path = "examples/recurrence.rs"
required-features = ["parser"]

[[example]]
name = "time_zones"
path = "examples/time_zones.rs"
required-features = ["parser"]

[[example]]
name = "strict_builder"
path = "examples/strict_builder.rs"
required-features = ["parser"]

[[example]]
name = "raw_builder"
path = "examples/raw_builder.rs"
required-features = ["parser"]

[[example]]
name = "validate_errors"
path = "examples/validate_errors.rs"
required-features = ["parser"]

[[example]]
name = "three_way_merge"
path = "examples/three_way_merge.rs"
required-features = ["parser"]

[[example]]
name = "calendar_file"
path = "examples/calendar_file.rs"
required-features = ["parser"]

[[example]]
name = "content_encodings"
path = "examples/content_encodings.rs"
required-features = ["parser", "quoted-printable", "base64", "encoding"]

[[example]]
name = "jcal"
path = "examples/jcal.rs"
required-features = ["parser", "jcal"]

[[example]]
name = "jscalendar"
path = "examples/jscalendar.rs"
required-features = ["parser", "jscalendar"]

[dev-dependencies]
calcard = { version = "0.3", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ical_crate = { package = "ical", version = "0.11", default-features = false, features = ["ical"] }
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"], optional = true }
memchr = { version = "2", default-features = false, optional = true }
quoted_printable = { version = "0.5", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
